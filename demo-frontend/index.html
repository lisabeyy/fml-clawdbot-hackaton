<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FML or Deserved? - Prediction Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .deserved-bar { background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%); }
        .fml-bar { background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="container mx-auto px-4 py-4 max-w-6xl">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-900">🎯 FML or Deserved?</h1>
                <div class="flex space-x-4">
                    <button onclick="showView('markets')" class="px-4 py-2 text-gray-700 hover:text-gray-900 font-medium">Markets</button>
                    <button onclick="showView('create')" class="px-4 py-2 text-gray-700 hover:text-gray-900 font-medium">Create</button>
                    <button onclick="showView('portfolio')" class="px-4 py-2 text-gray-700 hover:text-gray-900 font-medium">Portfolio</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Markets View -->
        <div id="markets-view">
            <div class="mb-6">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Judge the Stories</h2>
                <p class="text-gray-600">Did they deserve it, or was it pure bad luck? You decide.</p>
            </div>
            <div id="markets-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <!-- Create View -->
        <div id="create-view" class="hidden max-w-2xl mx-auto">
            <div class="mb-6">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Share Your Story</h2>
                <p class="text-gray-600">Tell us about a time things went wrong.</p>
            </div>
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Your Story</label>
                    <textarea id="story-content" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 resize-none"
                        rows="5" 
                        maxlength="280"
                        placeholder="Today I tried to impress my date by cooking..."></textarea>
                    <div class="mt-2 text-sm text-gray-600 text-right">
                        <span id="char-count">0</span> / 280
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Initial Liquidity (SOL)</label>
                    <input type="number" id="liquidity" value="0.1" step="0.1" min="0.1" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <button onclick="createMarket()" 
                    class="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">
                    Create Market
                </button>
            </div>
        </div>

        <!-- Portfolio View -->
        <div id="portfolio-view" class="hidden">
            <div class="mb-6">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Your Portfolio</h2>
                <p class="text-gray-600">Track your positions</p>
            </div>
            <div id="positions-list"></div>
        </div>

        <!-- Market Detail Modal -->
        <div id="market-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="modal-content" class="text-2xl font-bold text-gray-900"></h3>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                </div>
                <div id="modal-chart" class="mb-6"></div>
                <div id="modal-stats" class="grid grid-cols-3 gap-4 mb-6"></div>
                <div class="bg-white rounded-lg border border-gray-200 p-4">
                    <h4 class="font-bold mb-4">Place Your Judgment</h4>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <button onclick="selectSide('deserved')" id="btn-deserved"
                            class="py-3 px-4 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-red-500 hover:text-white">
                            😈 Deserved
                        </button>
                        <button onclick="selectSide('fml')" id="btn-fml"
                            class="py-3 px-4 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-blue-500 hover:text-white">
                            🍀 FML
                        </button>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Amount (SOL)</label>
                        <input type="number" id="trade-amount" value="0.01" step="0.01" min="0.001"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                    </div>
                    <button onclick="executeTrade()" id="trade-btn"
                        class="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">
                        Buy Shares
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Use relative URL for production (Vercel), localhost for development
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000/api' 
            : '/api';
        const WALLET = 'demo-user-' + Math.random().toString(36).substr(2, 9);
        
        let currentMarket = null;
        let selectedSide = 'deserved';

        // Initialize
        document.getElementById('story-content').addEventListener('input', (e) => {
            document.getElementById('char-count').textContent = e.target.value.length;
        });

        // Navigation
        function showView(view) {
            document.getElementById('markets-view').classList.add('hidden');
            document.getElementById('create-view').classList.add('hidden');
            document.getElementById('portfolio-view').classList.add('hidden');
            document.getElementById(`${view}-view`).classList.remove('hidden');
            
            if (view === 'markets') loadMarkets();
            if (view === 'portfolio') loadPortfolio();
        }

        // Load markets
        async function loadMarkets() {
            const response = await fetch(`${API_BASE}/markets?filter=active`);
            const markets = await response.json();
            
            const html = markets.map(market => `
                <div class="bg-white rounded-lg shadow-md hover:shadow-lg transition p-6 border border-gray-200 cursor-pointer"
                     onclick="openMarket('${market.id}')">
                    <p class="text-gray-800 mb-4">${market.content}</p>
                    ${renderPriceChart(market.deserved_percent, market.fml_percent)}
                    <div class="mt-4 flex justify-between text-sm text-gray-600">
                        <span>${market.vote_count} votes</span>
                        <span>${market.time_remaining || 'Ended'}</span>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('markets-list').innerHTML = html || '<p class="text-gray-600">No markets found</p>';
        }

        // Render price chart
        function renderPriceChart(deserved, fml) {
            return `
                <div class="space-y-2">
                    <div class="flex justify-between text-sm font-medium">
                        <span class="text-red-600">Deserved</span>
                        <span class="text-gray-700">${deserved}%</span>
                    </div>
                    <div class="w-full h-3 bg-gray-200 rounded-full overflow-hidden flex">
                        <div class="deserved-bar h-full transition-all" style="width: ${deserved}%"></div>
                        <div class="fml-bar h-full transition-all" style="width: ${fml}%"></div>
                    </div>
                    <div class="flex justify-between text-sm font-medium">
                        <span class="text-gray-700">${fml}%</span>
                        <span class="text-blue-600">FML</span>
                    </div>
                </div>
            `;
        }

        // Open market detail
        async function openMarket(id) {
            const response = await fetch(`${API_BASE}/markets/${id}`);
            const market = await response.json();
            currentMarket = market;
            
            document.getElementById('modal-content').textContent = market.content;
            document.getElementById('modal-chart').innerHTML = renderPriceChart(market.deserved_percent, market.fml_percent);
            document.getElementById('modal-stats').innerHTML = `
                <div class="text-center">
                    <div class="text-2xl font-bold">${market.vote_count}</div>
                    <div class="text-sm text-gray-600">Votes</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold">${market.total_volume} SOL</div>
                    <div class="text-sm text-gray-600">Volume</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold">${market.time_remaining || 'Ended'}</div>
                    <div class="text-sm text-gray-600">Time Left</div>
                </div>
            `;
            
            document.getElementById('market-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('market-modal').classList.add('hidden');
        }

        function selectSide(side) {
            selectedSide = side;
            document.getElementById('btn-deserved').className = 
                side === 'deserved' 
                ? 'py-3 px-4 rounded-lg font-bold bg-red-500 text-white'
                : 'py-3 px-4 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-red-500 hover:text-white';
            document.getElementById('btn-fml').className = 
                side === 'fml'
                ? 'py-3 px-4 rounded-lg font-bold bg-blue-500 text-white'
                : 'py-3 px-4 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-blue-500 hover:text-white';
        }

        async function executeTrade() {
            const amount = parseFloat(document.getElementById('trade-amount').value);
            
            try {
                const response = await fetch(`${API_BASE}/markets/${currentMarket.id}/buy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ side: selectedSide, amount, wallet: WALLET }),
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`✅ Bought ${result.shares.toFixed(4)} ${selectedSide} shares!`);
                    closeModal();
                    loadMarkets();
                } else {
                    alert('❌ Trade failed: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                alert('❌ Trade failed: ' + error.message);
            }
        }

        async function createMarket() {
            const content = document.getElementById('story-content').value;
            const liquidity = parseFloat(document.getElementById('liquidity').value);
            
            if (content.length < 10) {
                alert('Story must be at least 10 characters');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/markets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, initial_liquidity: liquidity, wallet: WALLET }),
                });
                
                const market = await response.json();
                alert(`✅ Market created! ID: ${market.id}`);
                document.getElementById('story-content').value = '';
                showView('markets');
            } catch (error) {
                alert('❌ Failed to create market: ' + error.message);
            }
        }

        async function loadPortfolio() {
            const response = await fetch(`${API_BASE}/positions/${WALLET}`);
            const positions = await response.json();
            
            if (positions.length === 0) {
                document.getElementById('positions-list').innerHTML = 
                    '<div class="bg-white rounded-lg shadow-md p-6 text-center"><p class="text-gray-600">No positions yet</p></div>';
                return;
            }
            
            const html = positions.map(pos => `
                <div class="bg-white rounded-lg shadow-md p-6 mb-4">
                    <p class="text-gray-800 mb-2">${pos.market.content}</p>
                    <div class="flex justify-between">
                        <div class="text-sm">
                            ${pos.deserved_shares > 0 ? `<span class="text-red-600">Deserved: ${pos.deserved_shares}</span>` : ''}
                            ${pos.fml_shares > 0 ? `<span class="text-blue-600 ml-4">FML: ${pos.fml_shares}</span>` : ''}
                        </div>
                        <div class="text-right">
                            <div class="font-bold">${pos.current_value} SOL</div>
                            <div class="text-sm ${parseFloat(pos.pnl) >= 0 ? 'text-green-600' : 'text-red-600'}">
                                ${parseFloat(pos.pnl) >= 0 ? '+' : ''}${pos.pnl} SOL
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('positions-list').innerHTML = html;
        }

        // Load markets on start
        loadMarkets();
    </script>
</body>
</html>
